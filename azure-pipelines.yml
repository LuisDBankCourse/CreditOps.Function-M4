# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- name: imagetag
  value: '$(Build.BuildId)'

steps:
- task: Docker@2
  displayName: 'Build and push azure function'
  inputs:
    containerRegistry: 'acr-creditflow-connection'
    repository: 'creditopsfunction'
    command: 'buildAndPush'
    Dockerfile: '$(Build.SourcesDirectory)/CreditOps.Function/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'

    tags: |
      $(imagetag)
      latest
